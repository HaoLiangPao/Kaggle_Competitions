# Configuration for Gradient Boosting (GBDT)

# Data Configuration
data:
  train_path: "train.csv"
  test_path: "test.csv"
  sample_submission_path: "sample_submission.csv"
  
  target_column: "exam_score"
  id_column: "id"
  
  feature_columns:
    - "age"
    - "study_hours"
    - "class_attendance"
    - "sleep_hours"
    - "gender"
    - "course"
    - "internet_access"
    - "sleep_quality"
    - "study_method"
    - "facility_rating"
    - "exam_difficulty"
  
  validate_schema: true

# Preprocessing Configuration
preprocessing:
  numerical_features:
    - "age"
    - "study_hours"
    - "class_attendance"
    - "sleep_hours"
    
  categorical_features:
    - "gender"
    - "course"
    - "internet_access"
    - "sleep_quality"
    - "study_method"
    - "facility_rating"
    - "exam_difficulty"
  
  # GBDT doesn't strictly need scaling, but it doesn't hurt.
  # We'll valid with scaling to keep preprocessing consistent with others
  # or we can set to false to demonstrate flexibility.
  scale_numerical: true
  impute_strategy: "median"

# Model Configuration
model:
  type: "gbdt"  # Sklearn GradientBoostingRegressor
  params:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    random_state: 42

# Training Configuration
training:
  cv_folds: 5
  random_state: 42

# Evaluation Configuration
evaluation:
  metrics: ['rmse', 'mae', 'r2']

# Output Configuration
output:
  artifacts_dir: "artifacts_gbdt"
  submission_file: "submission_gbdt.csv"
  
# Logging Configuration
logging:
  level: "INFO"
  log_file: "training_gbdt.log"
